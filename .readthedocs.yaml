version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    install:
      - >-
        UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH"
        uv sync --locked --no-dev --group docs

# Select uv for virtual environment setup.
python:
  install:
    - method: uv
      command: sync
