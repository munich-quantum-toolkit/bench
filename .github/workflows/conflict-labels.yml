name: 🏷️ Label merge conflicts

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflict-labels

jobs:
  label-conflicts:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Reconcile conflict labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changes=$(gh pr list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json number,mergeable,labels \
            --jq '.[]
              | any(.labels[]; .name == "conflict") as $labeled
              | select(.mergeable != "UNKNOWN" and $labeled != (.mergeable == "CONFLICTING"))
              | [.number, (if $labeled then "remove" else "add" end)]
              | @tsv')
          while read -r number action; do
            if [ -n "$number" ]; then
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" "--${action}-label" conflict
            fi
          done <<< "$changes"
