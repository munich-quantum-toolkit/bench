name: 🐳 Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Docker credentials
        if: github.event_name != 'pull_request'
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        if: steps.dockerhub.outputs.configured == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mqt-bench

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request' || steps.dockerhub.outputs.configured == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        if: github.event_name == 'pull_request' || steps.dockerhub.outputs.configured == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMAKE_BUILD_PARALLEL_LEVEL=4
          cache-from: type=gha,scope=mqt-bench,timeout=2m
          cache-to: type=gha,scope=mqt-bench,mode=max,timeout=2m,ignore-error=true
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ steps.dockerhub.outputs.configured == 'true' }}
          tags: ${{ github.event_name == 'pull_request' && 'mqt-bench:pr' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test Core compilation in the image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          docker run --rm --network none mqt-bench:pr \
            --compiler mqt --algorithm ghz --num-qubits 3 --level mapped --target iqm_crystal_5 \
            | grep '^// Compiler: mqt '
