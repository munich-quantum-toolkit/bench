name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@39381a969e9f5753cb113b04e3e3008e95267273
    with:
      additional-docs-files: >-
        ["{CHANGELOG,UPGRADING}.md", ".github/SUPPORT.md"]
    permissions:
      pull-requests: read

  docs:
    name: 📚 Docs
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-docs)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@39381a969e9f5753cb113b04e3e3008e95267273
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@39381a969e9f5753cb113b04e3e3008e95267273
    with:
      runs-on: ${{ matrix.runs-on }}
      use-sccache-gha: false
      sessions: >-
        ${{ github.event_name == 'pull_request' && matrix.runs-on != 'ubuntu-26.04'
            && '["tests-3.15"]' || '["minimums", "tests"]' }}
    permissions:
      contents: read

  python-coverage:
    name: 🐍 Coverage
    needs: [change-detection, python-tests]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@39381a969e9f5753cb113b04e3e3008e95267273
    permissions:
      contents: read
      id-token: write

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@39381a969e9f5753cb113b04e3e3008e95267273
    with:
      enable-ty: true
      enable-mypy: false
      use-sccache-gha: false
    permissions:
      contents: read

  package:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-build.yml@39381a969e9f5753cb113b04e3e3008e95267273
    permissions:
      contents: read

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - docs
      - python-tests
      - python-coverage
      - python-linter
      - package
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{ !fromJSON(needs.change-detection.outputs.run-docs) && 'docs,' || '' }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cd)
              && 'package' || ''
            }}
          jobs: ${{ toJSON(needs) }}
